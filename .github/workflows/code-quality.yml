name: Code Quality

on:
  pull_request:
    branches: [master]
    paths: &backend-paths
      - "service/**"
      - "core/**"
      - "module/**"
      - "src/**"
      - "tests/**"
      - "develop_tools/test/test_telegram_push.py"
      - "examples/plugins/**"
      - "pyproject.toml"
      - ".github/scripts/**"
      - ".github/workflows/code-quality.yml"
  push:
    branches: [master]
    paths: *backend-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend regression (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install headless service regression dependencies
        # Match the Git backend supported by the existing service extra.
        run: >-
          python -m pip install pytest httpx fastapi "pydantic<3" requests "rich>=14.2.0"
          watchfiles tomli tomli-w cryptography pynacl websockets psutil uvicorn
          "setuptools==80.10.2" "numpy<2" "opencv-python-headless==4.8.1.78"
          "adbutils==2.2.1" "uiautomator2==2.16.23"
          "pygit2==1.15.1; python_version < '3.11'"
          "pygit2==1.19.3; python_version >= '3.11'"
      - name: Verify service, workers, authentication and notification regressions
        run: >-
          python -m pytest -q tests/service tests/core tests/module tests/ci
          develop_tools/test/test_telegram_push.py

  windows-workers:
    name: Windows worker lifecycle (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install plugin contract dependencies
        run: >-
          python -m pip install pytest httpx fastapi "pydantic<3" requests rich
          watchfiles tomli tomli-w cryptography pynacl websockets psutil
          "pygit2==1.15.1; python_version < '3.11'"
          "pygit2==1.19.3; python_version >= '3.11'"
      - name: Verify manifests, authentication and real worker cleanup
        run: >-
          python -m pytest -q tests/service/test_plugins.py
          tests/service/test_plugins_transport.py tests/service/test_plugins_runtime.py
          tests/service/test_plugins_android.py tests/service/test_plugin_bundles.py
